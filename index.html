

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clarvoint</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: radial-gradient(circle at top, #0b1c2d, #020611);
  color: #e6f1ff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.card {
  width: 92%;
  max-width: 420px;
  background: rgba(10,20,40,0.88);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
  text-align: center;
}

h1 {
  color: #4fc3ff;
  margin-bottom: 8px;
}

button {
  background: #4fc3ff;
  border: none;
  color: #001;
  padding: 14px 22px;
  border-radius: 30px;
  font-size: 16px;
  margin-top: 16px;
  cursor: pointer;
}

button.secondary {
  background: rgba(255,255,255,0.08);
  color: #e6f1ff;
  margin-left: 8px;
}

button:disabled {
  opacity: 0.6;
}

.fade {
  animation: fade 2s ease-in-out infinite alternate;
}

@keyframes fade {
  from { opacity: 0.5; }
  to { opacity: 1; }
}

.hidden {
  display: none;
}

img {
  width: 100%;
  border-radius: 14px;
  margin-top: 12px;
}

.controls {
  margin-top: 12px;
}
</style>
</head>

<body>
<div class="card">

<h1>Clarvoint</h1>

<p id="text">
Your face is not who you are.<br>
But it carries echoes.
</p>

<div class="controls">
  <button id="mainBtn">Continue</button>
  <button id="soundBtn" class="secondary hidden">Sound: Off</button>
</div>

<input type="file" accept="image/*" capture="user" id="camera" class="hidden"/>
<img id="preview" class="hidden"/>

<!-- Ambient Sound -->
<audio id="ambient" loop preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_2b1d7b6cbe.mp3" type="audio/mpeg">
</audio>

</div>

<script>
const text = document.getElementById("text");
const mainBtn = document.getElementById("mainBtn");
const soundBtn = document.getElementById("soundBtn");
const cam = document.getElementById("camera");
const img = document.getElementById("preview");
const ambient = document.getElementById("ambient");

let step = 0;
let soundOn = false;

const pastLives = [
  {
    life: "You were a keeper of sacred knowledge, sworn to silence.",
    place: "A stone monastery where winters lasted years.",
    death: "Peacefully, after preserving words meant to survive fire.",
    lesson: "Patience and devotion.",
    echo: "You still feel drawn to meaning beneath language."
  },
  {
    life: "You watched the sea and guarded lives through storms.",
    place: "A lonely lighthouse on a fractured coast.",
    death: "Lost during a final rescue.",
    lesson: "Responsibility without recognition.",
    echo: "You remain calm when others panic."
  },
  {
    life: "You healed with hands and intuition before medicine had names.",
    place: "A forest settlement far from power.",
    death: "Exiled, not defeated.",
    lesson: "Trust your inner knowing.",
    echo: "You sense truth before evidence."
  }
];

let chosen = pastLives[Math.floor(Math.random() * pastLives.length)];
let revealStep = 0;

mainBtn.onclick = async () => {
  step++;

  if (step === 1) {
    text.innerHTML = `
      If you wish,<br>
      you may offer your image.<br><br>
      This image is never stored.
    `;
    mainBtn.textContent = "Take or Upload Selfie";
    soundBtn.classList.remove("hidden");
  }

  else if (step === 2) {
    cam.click();
  }

  else if (step === 3) {
    text.classList.add("fade");
    text.innerHTML = `
      Stillness…<br>
      Let the surface fade.<br>
      Let what remains speak.
    `;
    mainBtn.disabled = true;

    if (soundOn) ambient.play();

    setTimeout(() => {
      text.classList.remove("fade");
      reveal();
      mainBtn.disabled = false;
      mainBtn.textContent = "Continue";
    }, 8000);
  }

  else {
    reveal();
  }
};

cam.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  img.src = URL.createObjectURL(file);
  img.classList.remove("hidden");
  step = 2;
  mainBtn.textContent = "Begin Reading";
};

function reveal() {
  revealStep++;

  if (revealStep === 1) {
    text.innerHTML = chosen.life;
  }
  else if (revealStep === 2) {
    text.innerHTML = "Place:<br>" + chosen.place;
  }
  else if (revealStep === 3) {
    text.innerHTML = "End:<br>" + chosen.death;
  }
  else if (revealStep === 4) {
    text.innerHTML = "What you carried forward:<br>" + chosen.lesson;
  }
  else if (revealStep === 5) {
    text.innerHTML = "Why it still echoes:<br>" + chosen.echo;
    mainBtn.textContent = "Close";
  }
  else {
    text.innerHTML = `
      The past is not behind you.<br>
      It walks beside you.<br><br>
      Return gently.
    `;
    mainBtn.style.display = "none";
  }
}

soundBtn.onclick = () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "Sound: On" : "Sound: Off";
  if (!soundOn) ambient.pause();
};
</script>

</body>
</html>
