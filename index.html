<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Clarvoint — glimpses beyond the surface. A small, reflective vision generator." />
  <meta name="theme-color" content="#0f0f1a" />
  <title>Clarvoint</title>

  <style>
    :root{
      --bg1:#1b1b2f;
      --bg2:#0f0f1a;
      --card: rgba(255,255,255,0.06);
      --muted: rgba(242,242,242,0.85);
      --accent1:#8e9cff;
      --accent2:#c6b7ff;
      --radius:16px;
      --gap:16px;
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      color:var(--muted);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:24px;
      width:100%;
      max-width:480px;
      box-shadow:0 20px 40px rgba(0,0,0,0.45);
      text-align:center;
    }

    h1{font-size:1.6rem;margin:0 0 6px}
    .tagline{opacity:.85;margin:0 0 12px}

    form{display:flex;flex-direction:column;gap:var(--gap);align-items:stretch}
    label{display:block;text-align:left;font-size:.875rem;opacity:.9}
    .controls{display:flex;gap:12px}
    input[type="text"]{
      flex:1;
      padding:12px 14px;
      border-radius:10px;
      border:none;
      font-size:1rem;
      background:rgba(255,255,255,0.03);
      color:inherit;
      outline:2px solid transparent;
    }
    input[type="text"]:focus{outline-color:rgba(142,156,255,0.25)}
    button{
      padding:12px 14px;
      border-radius:10px;
      border:none;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      color:#08102a;
      font-weight:600;
      cursor:pointer;
    }
    button:disabled{opacity:.6;cursor:not-allowed}
    .result{
      margin-top:8px;
      font-size:1.05rem;
      line-height:1.5;
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      white-space:pre-wrap;
      text-align:center;
    }
    .footer{margin-top:14px;font-size:.75rem;opacity:.65}
    .actions{display:flex;gap:8px;justify-content:center}
    .small-btn{
      padding:8px 10px;border-radius:8px;border:none;background:rgba(255,255,255,0.04);color:var(--muted);cursor:pointer;font-size:.9rem;
    }

    :focus-visible{outline:3px solid rgba(142,156,255,0.22);outline-offset:2px}

    @media (prefers-reduced-motion: no-preference){
      .result{transition:opacity .28s ease, transform .18s ease}
      .result.enter{opacity:0;transform:translateY(6px)}
      .result.enter.show{opacity:1;transform:none}
    }
    @media (max-width:420px){
      .card{padding:18px}
      h1{font-size:1.3rem}
    }
  </style>
</head>
<body>
  <main class="card" id="main">
    <h1>Clarvoint</h1>
    <p class="tagline">Glimpses beyond the surface</p>

    <form id="clarvointForm" autocomplete="off" novalidate>
      <div>
        <label for="nameInput">Enter your name</label>
        <div class="controls" role="group" aria-labelledby="nameLabel">
          <input id="nameInput" name="name" type="text" inputmode="text" maxlength="80" placeholder="Your name"
                 aria-describedby="hint" />
          <button id="revealBtn" type="submit">Reveal Vision</button>
        </div>
      </div>
    </form>

    <div id="result" class="result" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="actions" style="margin-top:12px">
      <button id="copyBtn" class="small-btn" type="button" hidden>Copy</button>
      <button id="shareBtn" class="small-btn" type="button" hidden>Share</button>
    </div>

    <div class="footer">For reflection & entertainment only</div>
  </main>

  <script>
    (function(){
      const visions = [
        "You are closing a chapter you outgrew. What replaces it will feel lighter.",
        "Someone from your past thinks of you more than you realize.",
        "A small decision soon will quietly change your direction.",
        "Rest is not avoidance — it is preparation.",
        "You are learning to trust timing instead of force.",
        "A truth you already know will soon become impossible to ignore."
      ];

      const form = document.getElementById('clarvointForm');
      const nameInput = document.getElementById('nameInput');
      const resultEl = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');
      const shareBtn = document.getElementById('shareBtn');
      const revealBtn = document.getElementById('revealBtn');

      const STORAGE_KEY = 'clarvoint_name';

      // Load name from URL param or localStorage
      const urlName = new URLSearchParams(location.search).get('name');
      if (urlName) {
        nameInput.value = decodeURIComponent(urlName);
      } else {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) nameInput.value = saved;
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        reveal();
      });

      // Deterministic (but simple) hash to pick the same vision for the same name
      function nameHash(name){
        let h = 2166136261 >>> 0; // FNV-1a base
        for (let i=0;i<name.length;i++){
          h ^= name.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h;
      }

      function pickVision(name){
        const trimmed = name.trim();
        if (!trimmed) return null;
        // If name contains "?" or "!" treat as random
        const h = nameHash(trimmed.toLowerCase());
        const idx = Math.abs(h) % visions.length;
        return visions[idx];
      }

      function reveal(){
        const name = nameInput.value.trim();
        if (!name){
          resultEl.textContent = "A name helps focus the vision.";
          copyBtn.hidden = true;
          shareBtn.hidden = true;
          return;
        }

        // save
        try { localStorage.setItem(STORAGE_KEY, name); } catch (err){/*ignore*/}

        // Choose vision
        let vision = pickVision(name);
        if (!vision){
          // fallback to a random one
          vision = visions[Math.floor(Math.random()*visions.length)];
        }

        // Render
        resultEl.classList.remove('show');
        // small entrance animation if allowed
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          resultEl.classList.add('enter');
          requestAnimationFrame(() => {
            resultEl.textContent = `${name},\n\n${vision}`;
            resultEl.classList.add('show');
          });
        } else {
          resultEl.textContent = `${name},\n\n${vision}`;
        }

        copyBtn.hidden = false;
        shareBtn.hidden = false;
      }

      // Copy to clipboard
      copyBtn.addEventListener('click', async () => {
        const text = resultEl.textContent || '';
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = 'Copied ✓';
          setTimeout(()=>copyBtn.textContent='Copy',1300);
        } catch(e){
          // fallback
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); copyBtn.textContent = 'Copied ✓'; } catch(e){/*noop*/}
          ta.remove();
          setTimeout(()=>copyBtn.textContent='Copy',1300);
        }
      });

      // Share via URL param
      shareBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) return;
        const u = new URL(location.href);
        u.searchParams.set('name', encodeURIComponent(name));
        // prefer navigator.share when available
        if (navigator.share) {
          navigator.share({title:'Clarvoint', text:`${name}'s vision`, url:u.toString()})
            .catch(()=>{ prompt('Share this link', u.toString()); });
        } else {
          // copy link to clipboard
          navigator.clipboard?.writeText(u.toString()).then(()=> {
            shareBtn.textContent = 'Link copied';
            setTimeout(()=>shareBtn.textContent='Share',1200);
          }).catch(()=> {
            prompt('Share this link', u.toString());
          });
        }
      });

      // small UX: enable reveal on Ctrl+Enter as well or when field blurred with value?
      nameInput.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) {
          ev.preventDefault();
          reveal();
        }
      });

      // If the page loaded with a name param, reveal automatically
      if (urlName) reveal();

    })();
  </script>
</body>
</html>
