<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clarvoint</title>
  <meta name="description" content="Clarvoint — tap to reveal a whimsical past life." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #020617;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 360px;
      box-shadow: 0 0 40px rgba(56,189,248,0.15);
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background: #38bdf8;
      color: #020617;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #result.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Clarvoint</h1>
    <p>Tap to glimpse a past life.</p>
    <button id="reveal" type="button">Reveal Past Life</button>
    <div id="result" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script>
    (function () {
      const lives = [
        "A traveling healer in ancient Anatolia, known for calming voices.",
        "A lighthouse keeper who watched storms and saved strangers.",
        "A monk who copied texts by candlelight in the 12th century.",
        "A desert guide who navigated by stars, not maps.",
        "A quiet artisan who made instruments that outlived them."
      ];

      const btn = document.getElementById('reveal');
      const result = document.getElementById('result');

      function generate() {
        const life = lives[Math.floor(Math.random() * lives.length)];
        result.textContent = life;
        result.classList.add('show');
      }

      btn.addEventListener('click', generate);
    })();
  </script>
</body>
</html>
