<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clarvoint</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020617">
<meta name="description" content="A symbolic, guided reflection across recurring lives.">

<link rel="manifest" href="data:application/manifest+json,{
  &quot;name&quot;:&quot;Clarvoint&quot;,
  &quot;short_name&quot;:&quot;Clarvoint&quot;,
  &quot;start_url&quot;:&quot;.&quot;,
  &quot;display&quot;:&quot;standalone&quot;,
  &quot;background_color&quot;:&quot;#020617&quot;,
  &quot;theme_color&quot;:&quot;#020617&quot;
}">

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: radial-gradient(circle at top, #0f1f2a, #050b12);
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #020617;
  width: 92%;
  max-width: 420px;
  padding: 2rem;
  border-radius: 24px;
  box-shadow: 0 30px 60px rgba(0,0,0,.7);
  text-align: center;
}

h1 {
  color: #38bdf8;
  font-size: 2rem;
  margin-bottom: .4rem;
}

p {
  line-height: 1.65;
  font-size: 1.05rem;
  margin: 1rem 0;
}

button {
  padding: .8rem 1.5rem;
  border-radius: 999px;
  border: none;
  background: #38bdf8;
  color: #020617;
  font-size: 1rem;
  cursor: pointer;
  margin-top: .8rem;
}

.secondary {
  background: transparent;
  color: #38bdf8;
  border: 1px solid #38bdf8;
}

.small {
  font-size: .8rem;
  opacity: .6;
}

.hidden { display: none; }

video, canvas {
  width: 100%;
  border-radius: 14px;
  margin-top: 1rem;
}
</style>
</head>

<body>
<main class="card">
  <h1>Clarvoint</h1>
  <p id="text"></p>

  <button id="startBtn">Begin Journey</button>

  <video id="video" class="hidden" autoplay playsinline></video>
  <canvas id="canvas" class="hidden"></canvas>
  <button id="captureBtn" class="hidden">Capture</button>

  <button id="shareBtn" class="hidden secondary">Download Reflection</button>
  <button id="supportBtn" class="hidden secondary">Support Clarvoint</button>

  <p class="small">For reflection only. Nothing is stored.</p>
</main>

<audio id="tone" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_1b1d1b0c46.mp3">
</audio>

<script>
const text = document.getElementById("text");
const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const shareBtn = document.getElementById("shareBtn");
const supportBtn = document.getElementById("supportBtn");
const tone = document.getElementById("tone");

const lives = [
{
  thread: "the watcher",
  arc: [
    "You once stood watch at the edge of danger.",
    "Later, you learned to sense trouble before it arrived.",
    "Now, you notice what others overlook."
  ],
  mirror: "Your awareness is not anxiety — it is inheritance."
},
{
  thread: "the healer",
  arc: [
    "You soothed fear before you knew words.",
    "You learned that presence heals faster than advice.",
    "Now, people calm down simply by being near you."
  ],
  mirror: "You do not need fixing — you are the space where fixing happens."
},
{
  thread: "the maker",
  arc: [
    "You built quietly for survival.",
    "You shaped tools others depended on.",
    "Now, usefulness matters more to you than praise."
  ],
  mirror: "You measure worth by what endures."
}
];

let chosen = null;

text.innerHTML = `
This is a guided symbolic reflection.<br><br>
You will take a selfie to mark the beginning.<br>
The image is never stored or analyzed.
`;

startBtn.onclick = async () => {
  startBtn.classList.add("hidden");
  text.innerHTML = "Allow the camera.<br><br>Breathe once.";

  video.classList.remove("hidden");
  captureBtn.classList.remove("hidden");

  tone.volume = 0.25;
  tone.play().catch(()=>{});

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
  });
  video.srcObject = stream;
};

captureBtn.onclick = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  video.srcObject.getTracks().forEach(t => t.stop());
  video.classList.add("hidden");
  captureBtn.classList.add("hidden");

  chosen = lives[Math.floor(Math.random() * lives.length)];

  let i = 0;
  function nextLine() {
    if (i < chosen.arc.length) {
      text.innerHTML = chosen.arc[i];
      i++;
      setTimeout(nextLine, 3500);
    } else {
      finish();
    }
  }
  nextLine();
};

function finish() {
  text.innerHTML = `
    <strong>Thread:</strong> ${chosen.thread}<br><br>
    ${chosen.mirror}<br><br>
    <em>This pattern appears when reflection is needed.</em>
  `;
  shareBtn.classList.remove("hidden");
  supportBtn.classList.remove("hidden");
}

shareBtn.onclick = () => {
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#020617";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#38bdf8";
  ctx.font = "24px sans-serif";
  ctx.fillText("Clarvoint", 20, 40);
  ctx.fillStyle = "#e5e7eb";
  ctx.font = "18px sans-serif";
  ctx.fillText(`Thread: ${chosen.thread}`, 20, 80);
  ctx.fillText(chosen.mirror, 20, 120);

  const link = document.createElement("a");
  link.download = "clarvoint-reflection.png";
  link.href = canvas.toDataURL();
  link.click();
};

supportBtn.onclick = () => {
  window.open("https://buymeacoffee.com/yourname", "_blank");
};
</script>
</body>
</html>
